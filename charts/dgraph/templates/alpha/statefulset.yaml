{{- /* Generate comma-separated list of Zeros */}}
{{- define "multi_zeros" -}}
  {{- $zeroFullName := include "dgraph.zero.fullname" . -}}
  {{- $max := int .Values.zero.replicaCount -}}
  {{- $safeVersion := include "dgraph.version" . -}}
  {{- /* Reset $max to 1 if multiple zeros not supported by dgraph version */}}
  {{- if or (semverCompare "< 1.2.3" $safeVersion) (semverCompare "= 20.03.0" $safeVersion) -}}
     {{- $max = 1 -}}
  {{- end -}}

  {{- /* Append the cluster-domain suffix (trimmed, omitted when empty). */}}
  {{- $domainSuffix := include "dgraph.domainSuffix" . -}}

  {{- /* Create comma-separated list of zeros */}}
  {{- range $idx := until $max }}
    {{- printf "%s-%d.%s-headless.${POD_NAMESPACE}.svc%s:5080" $zeroFullName $idx $zeroFullName $domainSuffix -}}
    {{- if ne $idx (sub $max 1) -}}
      {{- print "," -}}
    {{- end -}}
  {{ end }}
{{- end -}}
{{- $hasS3Keys := include "dgraph.backups.keys.s3.enabled" . -}}
{{- $hasMinioKeys := include "dgraph.backups.keys.minio.enabled" . -}}
{{- $backupsEnabled := or .Values.backups.full.enabled .Values.backups.incremental.enabled }}
{{- $initContainerEnabled := or .Values.alpha.initContainers.init.enabled .Values.alpha.extraInitContainers }}
{{- /* native-TLS is active for alpha when alpha.tls is on. Computed once here (a
       bool) and reused for the --tls superflag, the HTTPS probe scheme, and the
       extraFlags/clientAuthType guards below. */}}
{{- $nativeTLS := .Values.alpha.tls.enabled }}
{{- /* ACL and encryption-at-rest activate from `enabled` below by synthesizing the
       matching superflag onto the alpha command. Fail rather than emit a duplicate
       flag if the operator also hand-set it in extraFlags. */}}
{{- if and .Values.alpha.acl.enabled (contains "--acl" (.Values.alpha.extraFlags | default "")) }}
{{- fail "alpha.acl.enabled synthesizes the --acl superflag, but alpha.extraFlags already contains --acl. Remove --acl from alpha.extraFlags (configure alpha.acl.secretFile / alpha.acl.existingSecret instead) so the flag is not passed twice." }}
{{- end }}
{{- if and .Values.alpha.encryption.enabled (contains "--encryption" (.Values.alpha.extraFlags | default "")) }}
{{- fail "alpha.encryption.enabled synthesizes the --encryption superflag, but alpha.extraFlags already contains --encryption. Remove --encryption from alpha.extraFlags (configure alpha.encryption.keyFile / alpha.encryption.existingSecret instead) so the flag is not passed twice." }}
{{- end }}
{{- /* native TLS synthesizes --tls from alpha.tls; a hand-set --tls in extraFlags
       would be passed twice. */}}
{{- if and $nativeTLS (contains "--tls" (.Values.alpha.extraFlags | default "")) }}
{{- fail "alpha.extraFlags contains --tls, but the chart synthesizes it when alpha.tls.enabled=true. Remove --tls from alpha.extraFlags and set alpha.tls.internalPort / clientName / clientAuthType instead." }}
{{- end }}
{{- /* client-auth-type applies to the external ports the built-in probes hit, so a
       cert-requiring mode breaks the certless kubelet probe handshake. */}}
{{- $certRequiringAuth := eq (include "dgraph.tls.certRequired" (dict "tls" .Values.alpha.tls)) "true" }}
{{- if and $nativeTLS $certRequiringAuth }}
{{- if not .Values.alpha.tls.clientName }}
{{- fail (printf "alpha.tls.clientAuthType=%s requires alpha.tls.clientName so in-cluster callers (inter-node TLS) can present a client certificate." .Values.alpha.tls.clientAuthType) }}
{{- end }}
{{- if or (and .Values.alpha.startupProbe.enabled (not .Values.alpha.customStartupProbe)) (and .Values.alpha.livenessProbe.enabled (not .Values.alpha.customLivenessProbe)) (and .Values.alpha.readinessProbe.enabled (not .Values.alpha.customReadinessProbe)) }}
{{- fail (printf "alpha.tls.clientAuthType=%s forces every client to present a certificate, which the built-in httpGet probes cannot do (the kubelet has no client cert). Relax alpha.tls.clientAuthType (e.g. VERIFYIFGIVEN) on the external ports, or supply alpha.customStartupProbe / customLivenessProbe / customReadinessProbe (exec probes that present the client cert)." .Values.alpha.tls.clientAuthType) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "dgraph.alpha.fullname" . }}
  namespace: {{ include "dgraph.namespace" . }}
  labels:
    {{- include "dgraph.labels" (dict "ctx" . "component" .Values.alpha.name) | nindent 4 }}
spec:
  serviceName: {{ template "dgraph.alpha.fullname" . }}-headless
  replicas: {{ .Values.alpha.replicaCount }}
  podManagementPolicy: {{ .Values.alpha.podManagementPolicy | quote }}
  updateStrategy:
    type: {{ .Values.alpha.updateStrategy | quote }}
    {{- if (eq "Recreate" .Values.alpha.updateStrategy) }}
    rollingUpdate: null
    {{- else if .Values.alpha.rollingUpdatePartition }}
    rollingUpdate:
      partition: {{ .Values.alpha.rollingUpdatePartition }}
    {{- end }}
  selector:
    matchLabels:
      app: {{ template "dgraph.name" . }}
      release: {{ .Release.Name }}
      component: {{ .Values.alpha.name }}
  template:
    metadata:
      name: {{ template "dgraph.alpha.fullname" . }}
      {{- if or .Values.alpha.metrics.enabled .Values.alpha.extraAnnotations }}
      annotations:
        {{- if .Values.alpha.metrics.enabled }}
        prometheus.io/path: /debug/prometheus_metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
        {{- end }}
        {{- with .Values.alpha.extraAnnotations }}
{{- toYaml . | trimSuffix "\n" | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "dgraph.labels" (dict "ctx" . "component" .Values.alpha.name "podLabels" .Values.alpha.podLabels) | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "dgraph.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.alpha.automountServiceAccountToken }}
      {{- if .Values.alpha.schedulerName }}
      schedulerName: {{ .Values.alpha.schedulerName }}
      {{- end }}
      {{- if or (eq .Values.alpha.antiAffinity "hard") (eq .Values.alpha.antiAffinity "soft") .Values.alpha.nodeAffinity }}
      affinity:
      {{- end }}
      {{- if eq .Values.alpha.antiAffinity "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values:
                - {{ .Values.alpha.name }}
            topologyKey: {{ .Values.alpha.podAntiAffinitytopologyKey }}
      {{- else if eq .Values.alpha.antiAffinity "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - {{ .Values.alpha.name }}
              topologyKey: {{ .Values.alpha.podAntiAffinitytopologyKey }}
      {{- end }}
      {{- with .Values.alpha.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
{{- include "dgraph.imagePullSecrets" . | indent 6 }}
      {{- if .Values.alpha.securityContext.enabled }}
      securityContext:
        {{- omit .Values.alpha.securityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.alpha.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.alpha.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.alpha.tolerations }}
      tolerations:
{{ toYaml .Values.alpha.tolerations | indent 8 }}
      {{- end }}
      {{- if $initContainerEnabled }}
      initContainers:
      {{- with .Values.alpha.extraInitContainers }}
        {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
      {{- if .Values.alpha.initContainers.init.enabled }}
      - name: {{ template "dgraph.alpha.fullname" . }}-init
        image: {{ template "dgraph.initContainers.init.image" . }}
        imagePullPolicy: {{ .Values.alpha.initContainers.init.image.pullPolicy | quote }}
        {{- if .Values.alpha.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.alpha.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.alpha.initContainers.init.env }}
        env:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        {{- with .Values.alpha.initContainers.init.envFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
        {{- range .Values.alpha.initContainers.init.command }}
          - {{ . | quote }}
        {{- end }}
        {{- with .Values.alpha.initContainers.init.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.alpha.persistence.enabled }}
        volumeMounts:
        - name: datadir
          mountPath: /dgraph
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ template "dgraph.alpha.fullname" . }}
        image: {{ template "dgraph.image" . }}
        {{- if .Values.alpha.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.alpha.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 7080
          name: grpc-alpha-int
        - containerPort: 8080
          name: http-alpha
        - containerPort: 9080
          name: grpc-alpha
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if and $backupsEnabled $hasMinioKeys }}
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ template "dgraph.backups.fullname" . }}-secret
                key: minio_access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ template "dgraph.backups.fullname" . }}-secret
                key: minio_secret_key
          {{- end }}
          {{- if and $backupsEnabled $hasS3Keys }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ template "dgraph.backups.fullname" . }}-secret
                key: s3_access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ template "dgraph.backups.fullname" . }}-secret
                key: s3_secret_key
          {{- end }}
          {{- if .Values.alpha.configFile }}
          - name: DGRAPH_ALPHA_CONFIG
            value: /dgraph/config/{{ first (keys .Values.alpha.configFile | uniq | sortAlpha) }}
          {{- end }}
        {{- with .Values.alpha.extraEnvs }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.alpha.envFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{/* NOTE: awk '{gsub(/\.$/,"") needed to trim */}}
        command:
          - bash
          - "-c"
          ## NOTE: awk gsub is needed to trim trailing period otherwise it causes
          ##       crash for Kubernetes without the domain name
          {{- /* TODO: Remove awk-gsub once dgraph-io/dgraph#6837 is merged and back-ported. */}}
          - |
            set -ex
            exec dgraph alpha --my=$(hostname -f | awk '{gsub(/\.$/,""); print $0}'):7080 --zero {{ template "multi_zeros" . }}{{ template "dgraph.logFlags" .Values.alpha }} {{ .Values.alpha.extraFlags }}{{- if .Values.alpha.acl.enabled }} --acl "secret-file=/dgraph/acl/{{ .Values.alpha.acl.secretFile }};"{{- end }}{{- if .Values.alpha.encryption.enabled }} --encryption "key-file=/dgraph/enc/{{ .Values.alpha.encryption.keyFile }};"{{- end }}{{- if $nativeTLS }} {{ include "dgraph.tlsFlag" (dict "tls" .Values.alpha.tls "path" "/dgraph/tls") }}{{- end }}
        resources:
{{ toYaml .Values.alpha.resources | indent 10 }}
        {{- if .Values.alpha.startupProbe.enabled }}
        startupProbe:
          httpGet:
            port: {{ .Values.alpha.startupProbe.port }}
            path: {{ .Values.alpha.startupProbe.path }}
            {{- if $nativeTLS }}
            scheme: HTTPS
            {{- end }}
          periodSeconds: {{ .Values.alpha.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.alpha.startupProbe.timeoutSeconds }}
          successThreshold: {{ .Values.alpha.startupProbe.successThreshold }}
          failureThreshold: {{ .Values.alpha.startupProbe.failureThreshold }}
        {{- else if .Values.alpha.customStartupProbe }}
        startupProbe: {{- toYaml .Values.alpha.customStartupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.alpha.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            port: {{ .Values.alpha.livenessProbe.port }}
            path: {{ .Values.alpha.livenessProbe.path }}
            {{- if $nativeTLS }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: {{ .Values.alpha.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.alpha.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.alpha.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.alpha.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.alpha.livenessProbe.failureThreshold }}
        {{- else if .Values.alpha.customLivenessProbe }}
        livenessProbe: {{- toYaml .Values.alpha.customLivenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.alpha.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            port: {{ .Values.alpha.readinessProbe.port }}
            path: {{ .Values.alpha.readinessProbe.path }}
            {{- if $nativeTLS }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: {{ .Values.alpha.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.alpha.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.alpha.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.alpha.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.alpha.readinessProbe.failureThreshold }}
        {{- else if .Values.alpha.customReadinessProbe }}
        readinessProbe: {{- toYaml .Values.alpha.customReadinessProbe | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: datadir
          mountPath: /dgraph
        {{- if .Values.alpha.configFile }}
        - name: config-volume
          mountPath: /dgraph/config
        {{- end }}
        {{- if .Values.alpha.tls.enabled }}
        - name: tls-volume
          mountPath: /dgraph/tls
        {{- end }}
        {{- if .Values.alpha.encryption.enabled }}
        - name: enc-volume
          mountPath: /dgraph/enc
        {{- end }}
        {{- if .Values.alpha.acl.enabled }}
        - name: acl-volume
          mountPath: /dgraph/acl
        {{- end }}
        {{- if and $backupsEnabled .Values.backups.nfs.enabled }}
        - name: backups-nfs-volume
          mountPath: {{ .Values.backups.nfs.mountPath }}
        {{- end }}
        {{- if and $backupsEnabled .Values.backups.volume.enabled }}
        - name: backups-vol-volume
          mountPath: {{ .Values.backups.volume.mountPath }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.alpha.terminationGracePeriodSeconds }}
      volumes:
      {{- if not .Values.alpha.persistence.enabled }}
      # When persistence is enabled the volumeClaimTemplates entry below supplies
      # the "datadir" volume - the StatefulSet controller injects a per-pod PVC
      # (datadir-<sts>-<ordinal>). Only declare an emptyDir fallback when
      # persistence is disabled.
      - name: datadir
        emptyDir: {}
      {{- end }}
      {{- if and $backupsEnabled (or $hasS3Keys $hasMinioKeys) }}
      - name: backup-secret-volume
        secret:
          secretName: {{ template "dgraph.backups.fullname" . }}-secret
      {{- end }}
      {{- if and $backupsEnabled .Values.backups.nfs.enabled }}
      - name: backups-nfs-volume
        persistentVolumeClaim:
          claimName: {{ template "dgraph.backups.fullname" . }}-claim
      {{- end }}
      {{- if and $backupsEnabled .Values.backups.volume.enabled }}
      - name: backups-vol-volume
        persistentVolumeClaim:
          claimName: {{ .Values.backups.volume.claim }}
      {{- end }}
      {{- if .Values.alpha.configFile }}
      - name: config-volume
        configMap:
          name: {{ template "dgraph.alpha.fullname" . }}-config
      {{- end }}
      {{- if .Values.alpha.tls.enabled }}
      - name: tls-volume
        secret:
          secretName: {{ template "dgraph.alpha.fullname" . }}-tls-secret
      {{- end }}
      {{- if .Values.alpha.encryption.enabled }}
      - name: enc-volume
        secret:
          # existingSecret lets a pre-created Secret supply the encryption key, so it
          # never has to be rendered through Helm values; otherwise mount the Secret
          # the chart renders from `encryption.file`.
          secretName: {{ .Values.alpha.encryption.existingSecret | default (printf "%s-encryption-secret" (include "dgraph.alpha.fullname" .)) }}
      {{- end }}
      {{- if .Values.alpha.acl.enabled }}
      - name: acl-volume
        secret:
          # existingSecret lets a pre-created Secret (e.g. one managed by Terraform or an
          # external secrets operator) supply the HMAC key, so it never has to be rendered
          # through Helm values; otherwise mount the Secret the chart renders from `acl.file`.
          secretName: {{ .Values.alpha.acl.existingSecret | default (printf "%s-acl-secret" (include "dgraph.alpha.fullname" .)) }}
      {{- end }}
{{- if .Values.alpha.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: datadir
        annotations:
          volume.alpha.kubernetes.io/storage-class: anything
      spec:
        accessModes:
        {{- range .Values.alpha.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.alpha.persistence.size | quote }}
      {{- if .Values.alpha.persistence.storageClass }}
      {{- if (eq "-" .Values.alpha.persistence.storageClass) }}
        storageClassName: ""
      {{- else }}
        storageClassName: {{ .Values.alpha.persistence.storageClass | quote }}
      {{- end -}}
      {{- end -}}
{{- end }}
