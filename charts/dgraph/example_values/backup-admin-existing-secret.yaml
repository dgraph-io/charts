## backup-admin-existing-secret.yaml
## Supply the backup admin password from a Secret created outside Helm, so it
## never passes through chart values or the release's stored state. Use this in
## place of backups.admin.password when the Secret is managed by Terraform, an
## external secrets operator, or a sealed-secrets controller.
##
## Create the Secret first, with a key matching passwordSecretKey:
##
##   kubectl create secret generic dgraph-backup-admin \
##     --from-literal=backup_admin_password='<password>'
##
## * https://docs.dgraph.io/admin/admin-tasks/binary-backups
alpha:
  acl:
    enabled: true
backups:
  full:
    enabled: true
  admin:
    user: groot
    ## Name of the pre-created Secret. When set, the chart does not render its
    ## own backups Secret entry for the password, and backups.admin.password is
    ## neither required nor read.
    existingSecret: dgraph-backup-admin
    ## Key within that Secret holding the password.
    passwordSecretKey: backup_admin_password
