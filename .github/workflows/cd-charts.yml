name: Release Charts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Stop if a changed chart's version is already released
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Same change detection as chart-releaser: charts changed since the latest tag.
          git fetch --tags --quiet
          latest_tag=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || git rev-list --max-parents=0 --first-parent HEAD)
          status=0
          for chart in $(git diff --find-renames --name-only "$latest_tag" -- charts | cut -d/ -f1-2 | sort -u); do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(sed -n 's/^name: *//p' "$chart/Chart.yaml")
            version=$(sed -n 's/^version: *//p' "$chart/Chart.yaml")
            if gh release view "$name-$version" >/dev/null 2>&1; then
              echo "::error file=$chart/Chart.yaml::$chart changed since $latest_tag, but $name-$version is already released. Bump its version."
              status=1
            fi
          done
          exit "$status"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Keep the Latest badge on the dgraph chart
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          version=$(sed -n 's/^version: *//p' charts/dgraph/Chart.yaml)
          if gh release view "dgraph-$version" >/dev/null 2>&1; then
            gh release edit "dgraph-$version" --latest
          fi
